<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner's World</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
    body { height:100vh; display:flex; justify-content:center; align-items:center; background:#f8ead7; overflow:hidden; }
    .container { width:90%; max-width:420px; padding:30px 25px; border-radius:40px; text-align:center; background:linear-gradient(180deg, #f8ead7, #e7d0b0); box-shadow:0 10px 40px rgba(0,0,0,0.15); }
    .logo { font-size:30px; font-weight:bold; color:#4d3725; margin-bottom:25px; letter-spacing:2px; text-transform:uppercase; }
    .tag { display:inline-block; padding:12px 20px; border-radius:40px; border:1px solid #bb9461; background:#f3dfc2; color:#9c7647; font-size:18px; margin-bottom:30px; }
    .title { font-size:42px; line-height:1.3; color:#3f2d20; font-weight:bold; margin-bottom:25px; }
    .title span { color:#b78a55; }
    .desc { font-size:18px; line-height:1.8; color:#5d4b3a; margin-bottom:35px; }
    
    .btn { display:block; width:100%; padding:18px; border-radius:50px; font-size:20px; text-decoration:none; text-align:center; margin-bottom:18px; transition:0.3s; }
    .btn-main { background:#b78a55; color:white; font-weight:bold; }
    .btn-second { background:transparent; border:2px solid #b78a55; color:#5a3c1e; font-weight:bold; }
    .btn:active { transform:scale(0.95); }
</style>
</head>
<body>
    <div class="container">
        <div class="logo">Planner's World</div>
        <div class="tag">🍁 عالم صناع الجمال الورقي</div>
        <div class="title">الرفاهية في التصميم <br> <span>تبدأ من هنا</span></div>
        <div class="desc">بلانرز فاخرة، ستيكرز، وورقيات تزيد يومك طاقة ونشاطاً وتبني لك عادة التنظيم المستدام.</div>
        
        <a href="products.html" class="btn btn-main">اكتشف مجموعتنا</a>
        <a href="https://www.instagram.com/planersworld/" target="_blank" class="btn btn-second">زيارة حسابنا على إنستغرام</a>
    </div>
</body>
</html>
